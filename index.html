<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WhiteWhyvern — Portfolio</title>
<style>
:root{
  --bg:#fbf8f3;
  --text:#2f2b26;
  --muted:#6e6a63;
  --accent:#b68b56;
  --gap:12px;
  --maxw:1400px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:Georgia,serif;color:var(--text);-webkit-font-smoothing:antialiased}

/* Minimal header */
header{height:64px;display:flex;align-items:center;gap:12px;padding:12px 20px}
.logo{width:40px;height:40px;background:linear-gradient(180deg,var(--accent),#c99a6b);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;border-radius:4px}
.title{display:flex;flex-direction:column}
.title .name{font-weight:800}
.title .sub{font-size:12px;color:var(--muted)}

/* Mosaic fills screen below header */
main{max-width:var(--maxw);margin:0 auto;padding:0 20px 20px}
.mosaic-wrap{min-height:calc(100vh - 64px);display:flex;align-items:stretch}
.mosaic{
  display:grid;
  gap:var(--gap);
  grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: 130px;
  align-items:stretch;
  width:100%;
  /* Asymmetric 9-tile layout (all rectangles), fills a big rectangle */
  grid-template-areas:
    "a a a b b c c d d d e e"
    "a a a b b c c d d d e e"
    "f f g g g h h h i i i i";
}

/* Map tiles */
.tile-a{grid-area:a}
.tile-b{grid-area:b}
.tile-c{grid-area:c}
.tile-d{grid-area:d}
.tile-e{grid-area:e}
.tile-f{grid-area:f}
.tile-g{grid-area:g}
.tile-h{grid-area:h}
.tile-i{grid-area:i}

/* Tile visuals */
.tile{
  display:block; position:relative; overflow:hidden;
  background:#fff; border:1px solid #ece8e3; text-decoration:none; color:inherit;
  border-radius:4px;
}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .42s ease,filter .22s}
.tile:hover img{transform:scale(1.04);filter:brightness(.98)}
.label{
  position:absolute;left:10px;bottom:10px;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent);
  color:#fff;padding:6px 10px;font-weight:700;font-size:13px;border-radius:2px;pointer-events:none
}

/* Responsive tweaks */
@media (max-width:1200px){
  .mosaic{grid-auto-rows:120px}
}
@media (max-width:1000px){
  .mosaic{
    grid-template-columns:repeat(8,1fr);
    grid-auto-rows:120px;
    grid-template-areas:
      "a a a b b c c d"
      "a a a b b c c d"
      "e e f f g g h h"
      "i i i i g g h h";
  }
}
@media (max-width:700px){
  .mosaic{
    grid-template-columns:repeat(2,1fr);
    grid-auto-rows:180px;
    grid-template-areas:
      "a a"
      "b b"
      "c c"
      "d d"
      "e e"
      "f f"
      "g g"
      "h h"
      "i i";
  }
}

/* Footer (optional) */
footer{text-align:center;padding:18px 12px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">WW</div>
  <div class="title">
    <div class="name">WhiteWhyvern</div>
    <div class="sub">light‑academia • art & systems</div>
  </div>
</header>

<main>
  <div class="mosaic-wrap">
    <div class="mosaic" role="list" aria-label="Portfolio mosaic">
      <a class="tile tile-a" href="./cv.html" role="listitem">
        <img src="https://placehold.co/1200x1000/efe7dd/8b6b4a?text=CV" alt="CV">
        <div class="label">CV</div>
      </a>

      <a class="tile tile-b" href="./art-portfolio.html" role="listitem">
        <img src="https://placehold.co/900x800/f6efe6/9b7f63?text=Art+Portfolio" alt="Art Portfolio">
        <div class="label">Art Portfolio</div>
      </a>

      <a class="tile tile-c" href="./scouting.html" role="listitem">
        <img src="https://placehold.co/900x1000/f8f4ef/a78a5b?text=Scouting" alt="Scouting">
        <div class="label">Scouting</div>
      </a>

      <a class="tile tile-d" href="./health4nova.html" role="listitem">
        <img src="https://placehold.co/1400x900/efe8df/8b6b4a?text=Health4NOVA" alt="Health4NOVA">
        <div class="label">Health4NOVA</div>
      </a>

      <a class="tile tile-e" href="./green-kites.html" role="listitem">
        <img src="https://placehold.co/1000x1000/f7f2eb/af8f66?text=Green+Kites" alt="Green Kites">
        <div class="label">Green Kites</div>
      </a>

      <a class="tile tile-f" href="./dental-missions.html" role="listitem">
        <img src="https://placehold.co/1000x800/f2ebe3/9a7a56?text=Dental+Missions" alt="Dental Missions">
        <div class="label">Dental Missions</div>
      </a>

      <a class="tile tile-g" href="./research.html" role="listitem">
        <img src="https://placehold.co/1100x800/efe7dd/8b6b4a?text=Research" alt="Research">
        <div class="label">Research</div>
      </a>

      <a class="tile tile-h" href="./awards.html" role="listitem">
        <img src="https://placehold.co/1000x800/f6efe6/9b7f63?text=Awards" alt="Awards">
        <div class="label">Awards</div>
      </a>

      <a class="tile tile-i" href="./hobbies.html" role="listitem">
        <img src="https://placehold.co/1400x900/f8f4ef/a78a5b?text=Hobbies" alt="Hobbies">
        <div class="label">Hobbies</div>
      </a>
    </div>
  </div>
</main>

<footer>
  © <span id="year"></span> WhiteWhyvern
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
