<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WhiteWhyvern — Portfolio</title>
<style>
:root{
  --bg:#fbf8f3;
  --text:#2f2b26;
  --muted:#6e6a63;
  --accent:#b68b56;
  --gap:12px;
  --maxw:1200px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:Georgia,serif;color:var(--text);-webkit-font-smoothing:antialiased}
header{height:72px;display:flex;align-items:center;gap:14px;padding:12px 20px;background:transparent}
.logo{width:48px;height:48;background:linear-gradient(180deg,var(--accent),#c99a6b);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;border-radius:4px}
.title{display:flex;flex-direction:column}
.title .name{font-weight:800}
.title .sub{font-size:12px;color:var(--muted)}
main{max-width:var(--maxw);margin:18px auto;padding:0 20px}
.hero{height:38vh;min-height:260px;background-image:linear-gradient(180deg,rgba(255,255,255,0.55),rgba(255,255,255,0.45)),url('https://placehold.co/1600x900/f6efe6/b68b56?text=Light+Academic+Hero');background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:36px;border-radius:0}
.hero h1{margin:0;font-size:clamp(28px,6vw,56px);letter-spacing:-1px}
.hero p{margin:8px 0 0;color:var(--muted)}
.collage-wrap{margin-top:-36px;padding:18px}
.collage{
  display:grid;
  gap:var(--gap);
  grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: 110px;
  align-items:stretch;
  grid-template-areas:
    "a a a a b b c c d d e e"
    "a a a a b b c c f f e e"
    "g g h h h i i j j k k l"
    "g g h h h i i j j k k l";
}
.tile-a{grid-area:a}
.tile-b{grid-area:b}
.tile-c{grid-area:c}
.tile-d{grid-area:d}
.tile-e{grid-area:e}
.tile-f{grid-area:f}
.tile-g{grid-area:g}
.tile-h{grid-area:h}
.tile-i{grid-area:i}
.tile-j{grid-area:j}
.tile-k{grid-area:k}
.tile-l{grid-area:l}
.tile{
  display:block;
  position:relative;
  overflow:hidden;
  background:#fff;
  border:1px solid #ece8e3;
  text-decoration:none;
  color:inherit;
  border-radius:4px;
}
.tile img{
  width:100%; height:100%; object-fit:cover; display:block; transition:transform .42s ease,filter .22s;
}
.tile:hover img{transform:scale(1.05);filter:brightness(.98)}
.label{
  position:absolute;left:12px;bottom:12px;background:linear-gradient(90deg,rgba(0,0,0,0.45),transparent);color:#fff;padding:6px 10px;font-weight:700;font-size:13px;border-radius:2px;pointer-events:none;
}
@media (max-width:1100px){
  .collage{grid-template-columns:repeat(8,1fr);grid-auto-rows:100px;
    grid-template-areas:
      "a a a b b c c d"
      "a a a b b f f e"
      "g g h h i i j j"
      "g g h h i i k l";}
}
@media (max-width:700px){
  .collage{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:160px;grid-template-areas:
    "a a"
    "b b"
    "c c"
    "d d"
    "e e"
    "f f"
    "g g"
    "h h"
    "i i"
    "j j"
    "k k"
    "l l";}
}
footer{text-align:center;padding:28px 12px;color:var(--muted);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<header>
  <div class="logo">WW</div>
  <div class="title">
    <div class="name">WhiteWhyvern</div>
    <div class="sub">light‑academia • art & systems</div>
  </div>
</header>

<section class="hero" aria-labelledby="hero-title">
  <div style="max-width:1100px">
    <h1 id="hero-title">WHITEWHYVERN</h1>
    <p class="lead">A curated portfolio blending classical references and generative systems — click any tile to open its page.</p>
  </div>
</section>

<main>
  <div class="collage-wrap">
    <div class="collage" role="list" aria-label="Portfolio collage">
      <a class="tile tile-a" href="./cv.html" role="listitem">
        <img src="https://placehold.co/1400x1000/efe7dd/8b6b4a?text=CV" alt="CV">
        <div class="label">CV</div>
      </a>

      <a class="tile tile-b" href="./art-portfolio.html" role="listitem">
        <img src="https://placehold.co/1100x800/f6efe6/9b7f63?text=Art+Portfolio" alt="Art Portfolio">
        <div class="label">Art Portfolio</div>
      </a>

      <a class="tile tile-c" href="./scouting.html" role="listitem">
        <img src="https://placehold.co/900x900/f8f4ef/a78a5b?text=Scouting" alt="Scouting">
        <div class="label">Scouting</div>
      </a>

      <a class="tile tile-d" href="./health4nova.html" role="listitem">
        <img src="https://placehold.co/1000x700/efe8df/8b6b4a?text=Health4NOVA" alt="Health4NOVA">
        <div class="label">Health4NOVA</div>
      </a>

      <a class="tile tile-e" href="./green-kites.html" role="listitem">
        <img src="https://placehold.co/1200x900/f7f2eb/af8f66?text=Green+Kites" alt="Green Kites">
        <div class="label">Green Kites</div>
      </a>

      <a class="tile tile-f" href="./dental-missions.html" role="listitem">
        <img src="https://placehold.co/900x700/f2ebe3/9a7a56?text=Dental+Missions" alt="Dental Missions">
        <div class="label">Dental Missions</div>
      </a>

      <a class="tile tile-g" href="./research.html" role="listitem">
        <img src="https://placehold.co/1000x800/efe7dd/8b6b4a?text=Research" alt="Research">
        <div class="label">Research</div>
      </a>

      <a class="tile tile-h" href="./awards.html" role="listitem">
        <img src="https://placehold.co/900x700/f6efe6/9b7f63?text=Awards" alt="Awards">
        <div class="label">Awards</div>
      </a>

      <a class="tile tile-i" href="./hobbies.html" role="listitem">
        <img src="https://placehold.co/1100x800/f8f4ef/a78a5b?text=Hobbies" alt="Hobbies">
        <div class="label">Hobbies</div>
      </a>

      <a class="tile tile-j" href="./project-extra-1.html" role="listitem">
        <img src="https://placehold.co/900x600/efe8df/8b6b4a?text=Extra+1" alt="Extra 1">
        <div class="label">Extra 1</div>
      </a>

      <a class="tile tile-k" href="./project-extra-2.html" role="listitem">
        <img src="https://placehold.co/900x600/f7f2eb/af8f66?text=Extra+2" alt="Extra 2">
        <div class="label">Extra 2</div>
      </a>

      <a class="tile tile-l" href="./project-extra-3.html" role="listitem">
        <img src="https://placehold.co/900x600/f2ebe3/9a7a56?text=Extra+3" alt="Extra 3">
        <div class="label">Extra 3</div>
      </a>

    </div>
  </div>
</main>

<footer>
  © <span id="year"></span> WhiteWhyvern
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
