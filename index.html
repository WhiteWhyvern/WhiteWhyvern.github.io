<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WhiteWhyvern — Portfolio Mosaic</title>
<style>
  :root{
    --umble:#3b2f2a; --cool-1:#bfc7cc; --accent:#d9a86e; --bg:#0b0d0f; --card:#111216; --maxw:1100px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--cool-1);-webkit-font-smoothing:antialiased}
  header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(90deg,var(--umble),#0f1416);box-shadow:0 6px 20px rgba(2,6,23,0.6)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44;border-radius:8px;background:linear-gradient(180deg,var(--accent),#c78a46);display:flex;align-items:center;justify-content:center;font-weight:800;color:#081016}
  main{max-width:var(--maxw);margin:28px auto;padding:0 20px 60px}
  h1{margin:0 0 14px 0;color:var(--cool-1);font-size:28px}

  /* Mosaic container: maintains a rectangle composed of differently sized tiles.
     Adjust grid-template-areas to change layout. */
  .mosaic-wrap{background:linear-gradient(180deg,var(--card),rgba(255,255,255,0.02));padding:14px;border-radius:12px;box-shadow:0 20px 60px rgba(2,6,23,0.6)}
  .mosaic{
    display:grid;
    gap:8px;
    grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: 80px;
    grid-template-areas:
      "a a a a a b b b c c d d"
      "a a a a a b b b c c d d"
      "e e f f f g g h h i i i"
      "e e f f f g g h h i i i";
    align-items:stretch;
  }

  /* tile placements */
  .tile-a{grid-area:a}
  .tile-b{grid-area:b}
  .tile-c{grid-area:c}
  .tile-d{grid-area:d}
  .tile-e{grid-area:e}
  .tile-f{grid-area:f}
  .tile-g{grid-area:g}
  .tile-h{grid-area:h}
  .tile-i{grid-area:i}

  /* link + image styling */
  .mosaic a{display:block;position:relative;overflow:hidden;border-radius:8px}
  .mosaic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.2,.9,.25,1),filter .3s}
  .mosaic a:hover img{transform:scale(1.06);filter:brightness(1.05) saturate(1.06)}
  /* caption overlay */
  .caption{position:absolute;left:12px;bottom:12px;color:#fff;font-weight:700;text-shadow:0 6px 18px rgba(0,0,0,0.6);pointer-events:none;font-size:14px}
  /* ensure rectangle keeps proportion on small screens */
  @media (max-width:900px){
    .mosaic{grid-template-columns:repeat(6,1fr);grid-auto-rows:70px;grid-template-areas:
      "a a b b c c"
      "a a b b d d"
      "e f f g g i"
      "e h h g g i";}
  }
  @media (max-width:520px){
    .mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:140px;grid-template-areas:
      "a a"
      "b b"
      "c c"
      "d d"
      "e e"
      "f f"
      "g g"
      "h h"
      "i i";}
  }

  small{color:var(--cool-1);opacity:.9}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">WW</div>
    <div>
      <div style="font-weight:800;color:var(--cool-1)">WhiteWhyvern</div>
      <div style="font-size:12px;color:var(--cool-1);opacity:.8">portfolio mosaic (click tiles)</div>
    </div>
  </div>
  <nav aria-label="top nav">
    <!-- keep these placeholder tabs if you want -->
    <button style="background:transparent;border:0;color:var(--cool-1);font-weight:700;cursor:pointer">Home</button>
    <button style="background:transparent;border:0;color:var(--cool-1);font-weight:700;cursor:pointer">Portfolio</button>
    <button style="background:transparent;border:0;color:var(--cool-1);font-weight:700;cursor:pointer">About</button>
    <button style="background:transparent;border:0;color:var(--cool-1);font-weight:700;cursor:pointer">Contact</button>
  </nav>
</header>

<main>
  <h1>Featured Works</h1>

  <div class="mosaic-wrap">
    <div class="mosaic" role="list">
      <!-- Tile A: large block (5 cols x 2 rows) -->
      <a class="tile-a" role="listitem" href="https://example.com/project-a" target="_blank" rel="noopener">
        <img src="https://placehold.co/1200x800/3b2f2a/bfc7cc?text=Project+A" alt="Project A preview">
        <div class="caption">Project A</div>
      </a>

      <!-- Tile B -->
      <a class="tile-b" role="listitem" href="https://example.com/project-b" target="_blank" rel="noopener">
        <img src="https://placehold.co/800x600/2b2f33/94a3b8?text=Project+B" alt="Project B preview">
        <div class="caption">Project B</div>
      </a>

      <!-- Tile C -->
      <a class="tile-c" role="listitem" href="https://example.com/project-c" target="_blank" rel="noopener">
        <img src="https://placehold.co/800x1000/44362f/bfc7cc?text=Project+C" alt="Project C preview">
        <div class="caption">Project C</div>
      </a>

      <!-- Tile D -->
      <a class="tile-d" role="listitem" href="https://example.com/project-d" target="_blank" rel="noopener">
        <img src="https://placehold.co/800x600/302826/94a3b8?text=Project+D" alt="Project D preview">
        <div class="caption">Project D</div>
      </a>

      <!-- Tile E -->
      <a class="tile-e" role="listitem" href="https://example.com/project-e" target="_blank" rel="noopener">
        <img src="https://placehold.co/900x900/5a4a40/bfc7cc?text=Project+E" alt="Project E preview">

      </a>

      <!-- Tile F -->
      <a class="tile-f" role="listitem" href="https://example.com/project-f" target="_blank" rel="noopener">
        <img src="https://placehold.co/700x500/2f2523/94a3b8?text=Project+F" alt="Project F preview">
        <div class="caption">Project F</div>
      </a>

      <!-- Tile G -->
      <a class="tile-g" role="listitem" href="https://example.com/project-g" target="_blank" rel="noopener">
        <img src="https://placehold.co/700x700/3f352f/bfc7cc?text=Project+G" alt="Project G preview">

      </a>

      <!-- Tile H -->
      <a class="tile-h" role="listitem" href="https://example.com/project-h" target="_blank" rel="noopener">
        <img src="https://placehold.co/700x500/2e2725/94a3b8?text=Project+H" alt="Project H preview">
        <div class="caption">Project H</div>
      </a>

      <!-- Tile I -->
      <a class="tile-i" role="listitem" href="https://example.com/project-i" target="_blank" rel="noopener">
        <img src="https://placehold.co/1200x600/4a362e/bfc7cc?text=Project+I" alt="Project I preview">
        <div class="caption">Project I</div>
      </a>
    </div>
  </div>

  <p style="margin-top:16px;color:var(--cool-1)"><small>Click any tile to open its page. Replace the placeholder src and href values with your images and targets.</small></p>
</main>
</body>
</html>
